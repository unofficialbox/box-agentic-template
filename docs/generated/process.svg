<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 746" role="img" aria-labelledby="title desc">
<title id="title">Commercial Loan Review process</title>
<desc id="desc">Ordered workflow. Each step includes its stop condition. Synthetic demonstration.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#53657c"/></marker></defs>
<rect width="960" height="746" fill="#f4f7fb"/>
<text x="40" y="42" font-family="sans-serif" font-size="24" fill="#172b4d">Box + Salesforce · synthetic demo</text>
<rect x="40" y="76" width="880" height="98" rx="12" fill="white" stroke="#c5d1df"/>
<text x="62" y="104" font-family="sans-serif" font-size="18" fill="#172b4d">1. Resolve Salesforce record and Box package</text>
<text x="62" y="129" font-family="sans-serif" font-size="14" fill="#172b4d">Owner: Loan officer</text>
<text x="62" y="154" font-family="sans-serif" font-size="14" fill="#172b4d">Hold: Stop if the record is missing or ambiguous.</text>
<path d="M480,174 V195" stroke="#53657c" marker-end="url(#arrow)"/>
<rect x="40" y="200" width="880" height="98" rx="12" fill="white" stroke="#c5d1df"/>
<text x="62" y="228" font-family="sans-serif" font-size="18" fill="#172b4d">2. Find and analyze the term sheet</text>
<text x="62" y="253" font-family="sans-serif" font-size="14" fill="#172b4d">Owner: Loan officer</text>
<text x="62" y="278" font-family="sans-serif" font-size="14" fill="#172b4d">Hold: Reject an unrelated folder or unsupported source claim.</text>
<path d="M480,298 V319" stroke="#53657c" marker-end="url(#arrow)"/>
<rect x="40" y="324" width="880" height="98" rx="12" fill="white" stroke="#c5d1df"/>
<text x="62" y="352" font-family="sans-serif" font-size="18" fill="#172b4d">3. Propose the bank terms</text>
<text x="62" y="377" font-family="sans-serif" font-size="14" fill="#172b4d">Owner: Loan officer</text>
<text x="62" y="402" font-family="sans-serif" font-size="14" fill="#172b4d">Hold: Reject stale versions, unknown fields, and invalid amounts.</text>
<path d="M480,422 V443" stroke="#53657c" marker-end="url(#arrow)"/>
<rect x="40" y="448" width="880" height="98" rx="12" fill="white" stroke="#c5d1df"/>
<text x="62" y="476" font-family="sans-serif" font-size="18" fill="#172b4d">4. Human credit decision</text>
<text x="62" y="501" font-family="sans-serif" font-size="14" fill="#172b4d">Owner: Credit officer</text>
<text x="62" y="526" font-family="sans-serif" font-size="14" fill="#172b4d">Hold: Hold the action when authorization or capability is missing.</text>
<path d="M480,546 V567" stroke="#53657c" marker-end="url(#arrow)"/>
<rect x="40" y="572" width="880" height="98" rx="12" fill="white" stroke="#c5d1df"/>
<text x="62" y="600" font-family="sans-serif" font-size="18" fill="#172b4d">5. Verify the exact generated draft</text>
<text x="62" y="625" font-family="sans-serif" font-size="14" fill="#172b4d">Owner: Loan officer</text>
<text x="62" y="650" font-family="sans-serif" font-size="14" fill="#172b4d">Hold: Hold mismatched jobs, stale versions, unresolved tags, and unapproved records.</text>
</svg>
